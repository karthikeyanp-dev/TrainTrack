name: Deploy to Firebase Hosting

# This workflow deploys hosting only. Roll out the secure booking-intake
# functions and Firestore rules before deploying this staff frontend.

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate staff sign-in deployment prerequisites
        env:
          STAFF_APPCHECK_SITE_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY }}
          STAFF_CUSTOMER_FORM_URL: ${{ secrets.NEXT_PUBLIC_CUSTOMER_FORM_URL }}
          STAFF_FIREBASE_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_ID }}
        run: |
          if [ -z "$STAFF_APPCHECK_SITE_KEY" ]; then
            echo "::error::Set NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY before deploying. Staff sign-in requires Firebase App Check."
            exit 1
          fi
          printf '%s\n' "NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY=$STAFF_APPCHECK_SITE_KEY" >> .env
          printf '%s\n' "NEXT_PUBLIC_CUSTOMER_FORM_URL=$STAFF_CUSTOMER_FORM_URL" >> .env
          printf '%s\n' "NEXT_PUBLIC_FIREBASE_DATABASE_ID=$STAFF_FIREBASE_DATABASE_ID" >> .env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file for build
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}" >> .env
          echo "NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}" >> .env

      - name: Build Next.js static export
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
